name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merges made with GITHUB_TOKEN (Dependabot auto-merge) don't trigger the
  # push run above, so main also gets a weekly run and a manual button
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only token: CI only checks out and runs checks
permissions:
  contents: read

# Only PR runs cancel stale ones; every main run gets its own group, so each commit is tested
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The only test that needs the databases. Skipped on PRs that can't affect it
  # (the steps, not the job: a separate check job would delay it); always
  # runs on main and the weekly run. Every other test runs in `build`.
  db-test:
    runs-on: ubuntu-latest
    # A run takes ~1.5 minutes; a hung DB connection shouldn't hold the runner
    # (and Dependabot auto-merge) for the 6-hour default
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR runs check out a merge commit, so HEAD^1 is the base branch
          fetch-depth: 2

      - name: Check for database-relevant changes
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- lib/ __tests__/cross-backend-import-export.test.ts package.json pnpm-lock.yaml vitest.config.ts docker-compose.yml .github/workflows/ci.yml; then
            echo DB_TESTS=true >> "$GITHUB_ENV"
          fi
        env:
          EVENT: ${{ github.event_name }}

      # docker-compose.yml rather than job services: services block the job
      # until healthy, while this pulls and boots in the background during the
      # Node setup. The exit code goes to a file for the wait step.
      - name: Start database services
        if: env.DB_TESTS
        run: (docker compose up -d --wait; echo $? > compose.exit) > compose.log 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.DB_TESTS

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.DB_TESTS
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.DB_TESTS

      - name: Wait for database services
        if: env.DB_TESTS
        run: |
          timeout 300 bash -c 'until [ -f compose.exit ]; do sleep 1; done' || true
          cat compose.log
          test "$(cat compose.exit 2>/dev/null)" = 0 || { docker compose logs; exit 1; }

      - run: pnpm test cross-backend-import-export
        if: env.DB_TESTS

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Weekly and manual runs only, so a new advisory doesn't block unrelated PRs
      - name: Audit production dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm audit --prod

      # PRs are squash-merged, so the title becomes the commit on main; the
      # commit-msg hook only sees local commits. Dependabot's titles come from
      # dependabot.yml's prefixes, and long image names overrun the length cap.
      - name: Lint PR title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm exec tsc --noEmit

      - run: pnpm test --exclude __tests__/cross-backend-import-export.test.ts

      - run: pnpm build

      # The build passing doesn't mean the server runs: this catches a broken
      # proxy bundle or /uploads rewrite. The upload is written after startup,
      # like a real one, since public/ is only indexed at startup.
      - name: Smoke-test the production server
        run: |
          pnpm start -p 9876 > server.log 2>&1 &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:9876/; do sleep 1; done' || { cat server.log; exit 1; }
          mkdir -p public/uploads && echo ok > public/uploads/ci-smoke.txt
          test "$(curl -sf http://127.0.0.1:9876/uploads/ci-smoke.txt)" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.test' http://127.0.0.1:9876/)" = 403

  # The `main` ruleset requires a check named "ci". always() matters: a job
  # skipped because a need failed counts as passing for required checks.
  ci:
    if: always()
    needs: [db-test, build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
