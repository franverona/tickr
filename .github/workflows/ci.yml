name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merges made with GITHUB_TOKEN (Dependabot auto-merge) don't trigger the
  # push run above, so main also gets a weekly run and a manual button
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only token: CI only checks out and runs checks
permissions:
  contents: read

# Only PR runs cancel stale ones; every main run gets its own group, so each commit is tested
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Same images and credentials as docker-compose.yml, so the cross-backend
    # tests' default connection URLs work unchanged
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tickr"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:26.7
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tickr
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmysql"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not a service: services can't take the start command the image needs.
      # Started early so it boots while dependencies install.
      - name: Start Firestore emulator
        run: >-
          docker run -d --name firestore -p 127.0.0.1:8080:8080
          gcr.io/google.com/cloudsdktool/google-cloud-cli:591.0.0-emulators
          gcloud emulators firestore start --host-port=0.0.0.0:8080

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PRs are squash-merged, so the title becomes the commit on main; the
      # commit-msg hook only sees local commits. Dependabot's titles come from
      # dependabot.yml's prefixes, and long image names overrun the length cap.
      - name: Lint PR title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm exec tsc --noEmit

      - name: Wait for Firestore emulator
        run: timeout 120 bash -c 'until curl -sf http://127.0.0.1:8080; do sleep 2; done'

      - run: pnpm test

      - run: pnpm build

      # The build passing doesn't mean the server runs: this catches a broken
      # proxy bundle or /uploads rewrite. The upload is written after startup,
      # like a real one, since public/ is only indexed at startup.
      - name: Smoke-test the production server
        run: |
          pnpm start -p 9876 > server.log 2>&1 &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:9876/; do sleep 1; done' || { cat server.log; exit 1; }
          mkdir -p public/uploads && echo ok > public/uploads/ci-smoke.txt
          test "$(curl -sf http://127.0.0.1:9876/uploads/ci-smoke.txt)" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.test' http://127.0.0.1:9876/)" = 403
