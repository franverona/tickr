name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merges made with GITHUB_TOKEN (Dependabot auto-merge) don't trigger the
  # push run above, so main also gets a weekly run and a manual button
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only token: CI only checks out and runs checks
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Same images and credentials as docker-compose.yml, so the cross-backend
    # tests' default connection URLs work unchanged
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tickr"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tickr
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmysql"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      - run: pnpm build
