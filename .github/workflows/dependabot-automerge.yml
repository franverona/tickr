name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # npm only. Not docker-compose: Dependabot doesn't update ci.yml's service
      # images, so CI would pass on the old image and the bump would merge untested.
      # Not github_actions: CI never runs most bumped actions, and this job runs
      # the bumped fetch-metadata with a write token, so those get a human review.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          # Below 1.0 a minor bump can break the API (e.g. kysely 0.29 -> 0.30)
          if jq -e 'any(.[]; (.prevVersion // "" | startswith("0.")) and .updateType == "version-update:semver-minor")' <<<"$DEPS" >/dev/null; then
            echo "0.x minor update: leaving it for manual review"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
