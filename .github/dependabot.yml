version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Matches the Node major in .nvmrc, so tsc rejects APIs Node 22 lacks
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Packages that must move together arrive as one PR (react without
    # react-dom is how main went red in #191)
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', 'eslint-config-next']
      commitlint:
        patterns: ['@commitlint/*']

  # ci.yml's service images aren't covered: sync them by hand when this updates
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions run with write tokens, so give a bad release time to be caught
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
