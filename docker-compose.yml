# Local Postgres/MySQL/Firestore emulator for testing DB_TYPE=postgres / mysql / firestore. Dev-only:
# fixed weak credentials are fine since these are bound to localhost.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tickr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickr
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tickr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickr']
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: tickr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: tickr
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - tickr-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -pmysql']
      interval: 5s
      timeout: 5s
      retries: 5

  # Firestore emulator for DB_TYPE=firestore without a live project. In-memory:
  # data is gone when the container stops.
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:591.0.0-emulators
    container_name: tickr-firestore
    restart: unless-stopped
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tickr-postgres-data:
  tickr-mysql-data:
