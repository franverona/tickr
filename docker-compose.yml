# Local Postgres/MySQL/Firestore emulator for testing DB_TYPE=postgres / mysql / firestore. Dev-only:
# fixed weak credentials are fine since these are bound to localhost.
# Fixed project name, so volumes are always tickr_<volume> (the README's
# commands name them) whatever folder the repo is cloned into
name: tickr

services:
  postgres:
    image: postgres:18-alpine
    container_name: tickr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickr
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # 18+ keeps data in a versioned subdirectory (18/docker) and refuses a
      # mount at /var/lib/postgresql/data, even on an empty volume
      - tickr-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickr']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  mysql:
    image: mysql:26.7
    container_name: tickr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: tickr
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - tickr-mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 forces TCP: the entrypoint's init server only listens on the
      # socket, so a socket ping would pass before the real server is up
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -pmysql']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # Firestore emulator for DB_TYPE=firestore without a live project. In-memory:
  # data is gone when the container stops.
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:591.0.0-emulators
    container_name: tickr-firestore
    restart: unless-stopped
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s
      start_interval: 1s

volumes:
  tickr-postgres-data:
  tickr-mysql-data:
