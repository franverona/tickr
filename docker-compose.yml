# Local Postgres for testing DB_TYPE=postgres. Dev-only: fixed weak
# credentials are fine since this is bound to localhost.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tickr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickr
    ports:
      - '5432:5432'
    volumes:
      - tickr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickr']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tickr-postgres-data:
