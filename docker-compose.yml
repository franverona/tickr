# Local Postgres/MySQL for testing DB_TYPE=postgres / DB_TYPE=mysql. Dev-only:
# fixed weak credentials are fine since these are bound to localhost.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tickr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickr
    ports:
      - '5432:5432'
    volumes:
      - tickr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tickr']
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: tickr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: tickr
    ports:
      - '3306:3306'
    volumes:
      - tickr-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -pmysql']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tickr-postgres-data:
  tickr-mysql-data:
