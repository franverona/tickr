allowBuilds:
  better-sqlite3: true
  # tsx's esbuild ships its binary as an optional platform package; its
  # postinstall only re-checks it, so it doesn't need to run
  esbuild: false
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Patched versions of vulnerable transitive dev dependencies (pnpm audit).
# Drop an entry once its parent (eslint-config-next, vitest) pulls the fix itself.
overrides:
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'source-map-js@<1.2.2': ^1.2.2
  'vite@>=8.2.0 <=8.2.3': ^8.2.4
